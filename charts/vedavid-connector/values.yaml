image:
  repository: ghcr.io/vedavid-dev/vedavid-connector
  tag: ""
  pullPolicy: IfNotPresent

relay:
  address: api.vedavid.dev:8443
  # The name checked against the relay's certificate. Defaults to the host above.
  serverName: ""
  # The Vedavid root. Override only to pin a different authority.
  caCertificate: ""

# Created out of band from the admin console; the chart never generates one.
enrolment:
  secretName: vedavid-enrolment-token
  secretKey: token

# Silence from the relay for this long means the tunnel is gone.
silenceSeconds: 120

prometheus:
  url: http://prometheus-server.monitoring.svc.cluster.local

# Shown in the app beside each dashboard.
clusterLabel: ""

dashboards:
  enabled: true
  path: /etc/vedavid/dashboards
  pollSeconds: 30
  # A ConfigMap named here must exist under exactly this name.
  sources:
    - configMap: vedavid-dashboards

# Ask answers plain-English questions from the app with dashboards assembled
# in the relay. Turn it off here, or correct how Ask reads this cluster with
# signal overrides; both decisions live in your repo. See the chart README.
ask:
  enabled: true
  signals: []

limits:
  maxDashboards: 100
  maxDashboardBytes: 262144
  maxDirectoryBytes: 4194304

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
