[package]
name = "vedavid-connector"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Answers PromQL queries from inside your cluster, over a connection it dials out"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = "0.14"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pinned by commit: the crate is not published yet.
vedavid-dashboard-dsl = { git = "https://github.com/vedavid-dev/dashboard-dsl", rev = "4a2ee083e56963c52da9fc13c4c60c970537fa19" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
