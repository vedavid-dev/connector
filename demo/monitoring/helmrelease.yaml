apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: prometheus
      # TODO before first apply: pin to the current prometheus-community/prometheus version.
      version: "25.24.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  # This chart pulls no Grafana or Alertmanager into the cluster.
  values:
    alertmanager:
      enabled: false

    server:
      retention: 15d
      extraArgs:
        storage.tsdb.retention.size: 6GB
      global:
        scrape_interval: 30s
        evaluation_interval: 30s
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: local-path
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { cpu: 500m, memory: 1Gi }
      service:
        type: ClusterIP

    serverFiles:
      alerting_rules.yml: {}
      recording_rules.yml: {}

    prometheus-node-exporter:
      resources:
        requests: { cpu: 20m, memory: 32Mi }
        limits: { memory: 64Mi }

    kube-state-metrics:
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { memory: 128Mi }

    prometheus-pushgateway:
      enabled: false
