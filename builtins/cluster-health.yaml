version: 1
id: cluster-health
title: Cluster health
sections:
  - title: Workloads
    elements:
      - type: stat
        title: Pods running
        query: sum(kube_pod_status_phase{phase="Running"})
        unit: count
      - type: stat
        title: Pods not ready
        query: sum(kube_pod_status_ready{condition="false"})
        unit: count
        thresholds:
          direction: above
          steps:
            - { at: 1, level: warning }
            - { at: 5, level: critical }
  - title: Nodes
    elements:
      - type: line
        title: CPU in use
        query: sum(rate(container_cpu_usage_seconds_total[5m]))
        unit: cores
      - type: line
        title: Memory in use
        query: sum(container_memory_working_set_bytes)
        unit: bytes
