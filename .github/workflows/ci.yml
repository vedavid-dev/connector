name: CI

on:
  push:
    tags: ['v*']
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    services:
      prometheus:
        image: prom/prometheus:v3.14.0
        ports:
          - 9099:9090
    env:
      VEDAVID_TEST_PROMETHEUS: http://127.0.0.1:9099
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Nothing else checks that the chart and the generator agree on a name.
      - name: The reference example generates the name the chart mounts
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar xz -C /tmp
          actual=$(/tmp/kustomize build examples/dashboards | awk '/^  name:/ {print $2; exit}')
          echo "generated: $actual"
          # Read this from the chart's dashboards.sources[0] once the chart exists.
          test "$actual" = vedavid-dashboards

      - name: Wait for the first scrape
        run: |
          for _ in $(seq 1 40); do
            if curl -sf "$VEDAVID_TEST_PROMETHEUS/api/v1/query?query=up" | grep -q '"value"'; then
              exit 0
            fi
            sleep 2
          done
          echo "prometheus produced no samples" >&2
          exit 1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4

      - name: Renders
        run: helm template t charts/vedavid-connector > /tmp/rendered.yaml

      # These two assertions are what keep the zero-permissions claim true.
      - name: Grants no Kubernetes permissions
        run: |
          set -euo pipefail
          ! grep -iE 'kind:[[:space:]]*(Cluster)?Role' /tmp/rendered.yaml
          grep -q 'automountServiceAccountToken: false' /tmp/rendered.yaml

      - name: Starts before any dashboard exists
        run: |
          set -euo pipefail
          helm template t charts/vedavid-connector --set dashboards.sources=null > /tmp/empty.yaml
          grep -q 'kind: Deployment' /tmp/empty.yaml
          grep -q 'optional: true' /tmp/rendered.yaml

      - name: Listens on nothing
        run: |
          set -euo pipefail
          ! grep -qE '^kind: Service$|containerPort' /tmp/rendered.yaml

  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The default driver cannot export a cache.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
