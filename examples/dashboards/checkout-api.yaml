version: 1
id: checkout-api
title: Checkout API
sections:
  - title: Traffic
    elements:
      - type: stat
        title: Requests
        query: sum(rate(http_requests_total{job="checkout"}[5m]))
        unit: requests_per_sec
      - type: line
        title: Latency p95
        query: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="checkout"}[5m])))
        unit: seconds
  - title: Errors
    elements:
      - type: list
        title: 5xx by route
        query: sum by (route) (rate(http_requests_total{job="checkout",code=~"5.."}[5m]))
        unit: ops_per_sec
        label: "{{route}}"
        limit: 10
